{% from "_icons.html" import icon %}
{% from "_nav_badge.html" import waiting_badge, waiting_count_tab %}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ product_name }}{% endblock %} · {{ vendor_name }}</title>
<link rel="icon" href="/static/icon.svg?v={{ asset_version }}" type="image/svg+xml">
{# htmx ships its own indicator CSS as an inline <style>, which this page's
   Content-Security-Policy refuses. The same two rules live in app.css instead.
   Configured by meta tag because an inline <script> is refused too. #}
<meta name="htmx-config" content='{"includeIndicatorStyles":false}'>
{% if fonts_url %}
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="{{ fonts_url }}">
{% endif %}
<link rel="stylesheet" href="/static/brand.css?v={{ asset_version }}">
<link rel="stylesheet" href="/static/app.css?v={{ asset_version }}">
{# htmx keeps the line-status band current without reloading the page. #}
<script src="/static/htmx.min.js?v={{ asset_version }}" defer></script>
{# Our own: a pressed button says so while the server is working. #}
<script src="/static/app.js?v={{ asset_version }}" defer></script>
</head>
<body>
{# `dialog_open` marks a page that is asking a question in a <dialog>. A
   server-rendered `<dialog open>` is NOT modal: without `inert` on everything
   behind it, the page under the question stays tabbable and clickable and a
   keyboard user walks straight out of the dialog into the navigation. `inert`
   is an attribute, so this needs no JavaScript — which the page's CSP would
   refuse inline anyway. #}
<a class="skip-link" href="#main"{% if dialog_open %} inert{% endif %}>Skip to the page content</a>
{% block body %}
<div class="shell"{% if dialog_open %} inert{% endif %}>
  <aside class="rail" aria-label="Sections">
    <div class="rail-brand">
      {% if has_logo %}
      <img class="rail-logo" src="/static/logo" alt="{{ vendor_name }}">
      {% else %}
      <span class="wordmark">{{ vendor_name }}</span>
      {% endif %}
      <span class="eyebrow accent">{{ product_name }}</span>
    </div>
    <nav class="nav">
      {% for item in nav %}
        {% if item.url %}
      <a class="nav-item{{ ' active' if path == item.url else '' }}" href="{{ item.url }}"{% if path == item.url %} aria-current="page"{% endif %}>{{ icon(item.icon) }}<span>{{ item.label }}</span>{% if item.badge %}{{ waiting_badge(waiting) }}{% endif %}</a>
        {% else %}
      <span class="nav-item nav-group">{{ icon(item.icon) }}<span>{{ item.label }}</span></span>
        {% endif %}
        {% for child in item.children %}
      <a class="nav-item nav-sub{{ ' active' if path == child.url else '' }}" href="{{ child.url }}"{% if path == child.url %} aria-current="page"{% endif %}><span>{{ child.label }}</span></a>
        {% endfor %}
      {% endfor %}
    </nav>
    <div class="rail-foot">
      {% if session %}
      <div class="rail-owner">
        <span class="strong">{{ vendor_name }}</span>
        <span class="subtle">{{ session.profile_keys | length }} business{{ '' if session.profile_keys | length == 1 else 'es' }}</span>
      </div>
      <form method="post" action="/sign-out">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <button class="linkish" type="submit">{{ icon("logout", 18) }}<span>Sign out</span></button>
      </form>
      <form method="post" action="/sign-out-all">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <button class="linkish quiet" type="submit"><span>Sign out everywhere</span></button>
      </form>
      {% endif %}
    </div>
  </aside>
  <main class="main" id="main">
    {% block main %}{% endblock %}
  </main>
</div>
{% if nav %}
<nav class="tabbar"{% if dialog_open %} inert{% endif %} aria-label="Sections">
  {% for item in nav %}
    {% if item.url %}
  <a class="tab{{ ' active' if path == item.url else '' }}" href="{{ item.url }}"{% if path == item.url %} aria-current="page"{% endif %}>{{ icon(item.icon, 22) }}<span>{{ item.label }}{% if item.badge %}{{ waiting_count_tab(waiting) }}{% endif %}</span></a>
    {% endif %}
    {% for child in item.children %}
  <a class="tab{{ ' active' if path == child.url else '' }}" href="{{ child.url }}"{% if path == child.url %} aria-current="page"{% endif %}>{{ icon(child.icon, 22) }}<span>{{ child.label }}</span></a>
    {% endfor %}
  {% endfor %}
</nav>
{% endif %}
{# Anything that sits ON TOP of the page — a confirm dialog — belongs here,
   outside the `inert` shell above: content inside an inert subtree cannot be
   used, and that would include the question itself. #}
{% block overlay %}{% endblock %}
{% endblock %}
</body>
</html>

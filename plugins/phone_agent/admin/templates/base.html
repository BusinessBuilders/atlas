{% from "_icons.html" import icon %}
{% from "_nav_badge.html" import waiting_badge, waiting_count_tab %}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ product_name }}{% endblock %} · {{ vendor_name }}</title>
<link rel="icon" href="/static/icon.svg?v={{ asset_version }}" type="image/svg+xml">
{# htmx ships its own indicator CSS as an inline <style>, which this page's
   Content-Security-Policy refuses. The same two rules live in app.css instead.
   Configured by meta tag because an inline <script> is refused too. #}
{# `responseHandling`: a refused save answers 400 (or 409 when the form was
   built before somebody else's) and hands back the same panel with the reason
   and every value still in it. htmx ignores an error response by default,
   which would show the owner a button that did nothing — these two codes are
   swapped in, everything else in the 4xx/5xx range is still an error.

   `attributesToSettle` drops `style` from htmx's default list. Settling it
   writes a `style` ATTRIBUTE onto every element it matches by id, which is an
   inline style — and this page's Content-Security-Policy forbids those on
   purpose. Nothing here styles anything inline, so the only thing that
   setting could ever produce is a console full of refusals on a page a
   customer is looking at. #}
<meta name="htmx-config" content='{"includeIndicatorStyles":false,"attributesToSettle":["class","width","height"],"responseHandling":[{"code":"204","swap":false},{"code":"[23]..","swap":true},{"code":"40[09]","swap":true,"error":false},{"code":"[45]..","swap":false,"error":true}]}'>
{% if fonts_url %}
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="{{ fonts_url }}">
{% endif %}
<link rel="stylesheet" href="/static/brand.css?v={{ asset_version }}">
<link rel="stylesheet" href="/static/app.css?v={{ asset_version }}">
{# htmx keeps the line-status band current without reloading the page. #}
<script src="/static/htmx.min.js?v={{ asset_version }}" defer></script>
{# Our own: a pressed button says so while the server is working. #}
<script src="/static/app.js?v={{ asset_version }}" defer></script>
</head>
<body>
{# `dialog_open` marks a page that is asking a question in a <dialog>. A
   server-rendered `<dialog open>` is NOT modal: without `inert` on everything
   behind it, the page under the question stays tabbable and clickable and a
   keyboard user walks straight out of the dialog into the navigation. `inert`
   is an attribute, so this needs no JavaScript — which the page's CSP would
   refuse inline anyway. #}
<a class="skip-link" href="#main"{% if dialog_open %} inert{% endif %}>Skip to the page content</a>
{% block body %}
<div class="shell"{% if dialog_open %} inert{% endif %}>
  <aside class="rail" aria-label="Sections">
    <div class="rail-brand">
      {% if has_logo %}
      <img class="rail-logo" src="/static/logo" alt="{{ vendor_name }}">
      {% else %}
      <span class="wordmark">{{ vendor_name }}</span>
      {% endif %}
      <span class="eyebrow accent">{{ product_name }}</span>
    </div>
    {# A screen reached at /settings/acme belongs to the /settings row: the
       highlight follows the section an owner is in, not an exact URL match. #}
    {% macro is_here(url) %}{{ 'yes' if url and (path == url or (url != '/' and path.startswith(url ~ '/'))) else '' }}{% endmacro %}
    <nav class="nav">
      {% for item in nav %}
        {% set here = is_here(item.url) | trim %}
        {% if item.url %}
      <a class="nav-item{{ ' active' if here else '' }}" href="{{ item.url }}"{% if path == item.url %} aria-current="page"{% endif %}>{{ icon(item.icon) }}<span>{{ item.label }}</span>{% if item.badge %}{{ waiting_badge(waiting) }}{% endif %}</a>
        {% else %}
      <span class="nav-item nav-group">{{ icon(item.icon) }}<span>{{ item.label }}</span></span>
        {% endif %}
        {% for child in item.children %}
        {% set child_here = is_here(child.url) | trim %}
      <a class="nav-item nav-sub{{ ' active' if child_here else '' }}" href="{{ child.url }}"{% if child_here %} aria-current="page"{% endif %}><span>{{ child.label }}</span></a>
        {% endfor %}
      {% endfor %}
    </nav>
    <div class="rail-foot">
      {% if session %}
      <div class="rail-owner">
        <span class="strong">{{ vendor_name }}</span>
        <span class="subtle">{{ session.profile_keys | length }} business{{ '' if session.profile_keys | length == 1 else 'es' }}</span>
      </div>
      <form method="post" action="/sign-out">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <button class="linkish" type="submit">{{ icon("logout", 18) }}<span>Sign out</span></button>
      </form>
      <form method="post" action="/sign-out-all">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <button class="linkish quiet" type="submit"><span>Sign out everywhere</span></button>
      </form>
      {% endif %}
    </div>
  </aside>
  <main class="main" id="main">
    {% block main %}{% endblock %}
  </main>
</div>
{% if nav %}
{# Top level only. A phone's tab bar holds four or five thumb-sized targets;
   the Settings screens each carry their own picker across the top, which is
   where an owner moves between them on a small screen. #}
<nav class="tabbar"{% if dialog_open %} inert{% endif %} aria-label="Sections">
  {% for item in nav %}
    {% if item.url %}
  <a class="tab{{ ' active' if (path == item.url or (item.url != '/' and path.startswith(item.url ~ '/'))) else '' }}" href="{{ item.url }}"{% if path == item.url %} aria-current="page"{% endif %}>{{ icon(item.icon, 22) }}<span>{{ item.label }}{% if item.badge %}{{ waiting_count_tab(waiting) }}{% endif %}</span></a>
    {% endif %}
  {% endfor %}
</nav>
{% endif %}
{# Anything that sits ON TOP of the page — a confirm dialog — belongs here,
   outside the `inert` shell above: content inside an inert subtree cannot be
   used, and that would include the question itself. #}
{% block overlay %}{% endblock %}
{% endblock %}
</body>
</html>

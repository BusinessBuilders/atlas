# The phone line's fallback TwiML, served by nginx on the PUBLIC VPS.
#
# What this is for: when the bridge machine cannot answer — it is off, the SSH
# tunnel is down, the house lost power — Twilio retries the call against the
# number's voice_fallback_url. That URL has to be somewhere the outage cannot
# reach, which is why it is here on the VPS and not on the machine that just
# died. The caller then hears one sentence and is connected to a person,
# instead of Twilio's own "an application error has occurred".
#
# HOW TO INSTALL (on the VPS, as root):
#
#   1. Make the directory and put the rendered file(s) in it:
#        mkdir -p /var/www/atlas-phone
#        # from your machine, after: twilio_config.py --render
#        scp deploy/phone/rendered/fallback-15088863046.xml \
#            vps:/var/www/atlas-phone/fallback.xml
#        chmod 644 /var/www/atlas-phone/*.xml
#
#   2. Paste the two location blocks below INSIDE the existing
#      `server { ... }` for ai.business-builder.online — the same server block
#      that already proxies /phone/ down the SSH tunnel. (Or save this file to
#      /etc/nginx/snippets/phone-fallback.conf and add
#      `include snippets/phone-fallback.conf;` inside that server block.)
#
#   3. Check and reload:
#        nginx -t && systemctl reload nginx
#
#   4. Prove it from anywhere:
#        curl -i https://ai.business-builder.online/phone/fallback.xml
#      Expect: HTTP 200, `Content-Type: text/xml`, a body starting with
#      `<?xml` and containing `<Response>`.
#
# These locations are EXACT/prefix matches, so they win over the `/phone/`
# proxy_pass that sends everything else down the tunnel — the fallback must be
# served even when that tunnel is the thing that is broken.

# One number: the shared path. twilio_config.py sets voice_fallback_url to
# this while the account has a single mapped number.
location = /phone/fallback.xml {
    alias /var/www/atlas-phone/fallback.xml;

    # Twilio parses the body as TwiML, and it must arrive as XML. `types { }`
    # empties the MIME table for this location so default_type is what answers,
    # whatever the server-wide mime.types says about .xml.
    types { }
    default_type text/xml;

    # An outage answer must never be a cached one: the file changes when the
    # business's forward number changes, and that is exactly the moment it
    # matters.
    add_header Cache-Control "no-store" always;

    # Reachable when the tunnel is not; that is the whole point.
    access_log /var/log/nginx/phone-fallback.log;
}

# Two or more numbers: each business gets its own file, because one shared
# fallback can only name one business and can only forward to one person.
# twilio_config.py renders these as fallback-<digits>.xml and points each
# number's voice_fallback_url at its own.
location ~ ^/phone/(fallback-[0-9]+\.xml)$ {
    alias /var/www/atlas-phone/$1;

    types { }
    default_type text/xml;
    add_header Cache-Control "no-store" always;
    access_log /var/log/nginx/phone-fallback.log;
}
